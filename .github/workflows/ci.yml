name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test

  wordpress-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: php -v
      - run: bash packages/wordpress/test/stock-wordpress.sh

  wordpress-runtime-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: php -v
      - run: npm install
      - run: bash packages/wordpress/test/stock-wordpress-runtime.sh

  wordpress-options-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: php -v
      - run: npm install
      - run: bash packages/wordpress/test/stock-wordpress-options.sh
